<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KALIDA - 通用世界观模拟器</title>
    <style>
        /* All CSS from your file is included here for a self-contained example */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { --bg:#fef9f5; --bg2:#fff7f2; --card:#ffffff; --card2:#fff5ef; --accent:#f4a7b0; --accent2:#f4a9a8; --accent3:#ffd89e; --accent4:#b8ddb5; --text:#4a3f3a; --text2:#b5a59a; --text3:#d4c8be; --border:#f5e0d8; --border2:#edd5cb; --shadow:0 2px 12px rgba(244,167,176,0.1); --shadow2:0 4px 20px rgba(244,167,176,0.15); --pink:#fce4e8; --pink2:#fff0f3; --pink3:#ffd6dc; --blue:#e8f2fc; --green:#e5f5e0; --yellow:#fef8e0; --r:18px; --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; --fs:14px; }
        body { font-family: var(--font); font-size: var(--fs); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        .screen { display: none; min-height: 100vh; width:100%; }
        .screen.active { display: flex; flex-direction: column; animation: 0.3s ease 0s 1 normal none running fadeIn; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0px); } }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(16px); } 100% { opacity: 1; transform: translateY(0px); } }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes popIn { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .lo-ov { display: none; position: fixed; inset: 0px; background: rgba(254, 249, 245, 0.92); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; gap: 12px; backdrop-filter: blur(4px); }
        .lo-ov.show { display: flex; }
        .lo-sp { width: 32px; height: 32px; border: 3px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: 0.8s linear 0s infinite normal none running spin; }
        .lo-t { font-size: 12px; color: var(--text2); }
        .cloud { background: var(--card); border: 1.5px solid var(--border); border-radius: 22px; margin: 8px 14px; padding: 14px; box-shadow: var(--shadow); position: relative; animation: 0.4s ease 0s 1 normal none running slideUp; }
        .cloud.nt::before { display: none; }
        .cloud-t { font-size: 13px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .hdr { background: linear-gradient(135deg, rgb(255, 245, 247), rgb(255, 240, 243)); padding: 14px 16px; text-align: center; border-bottom: 1px solid var(--border); position: sticky; top: 0px; z-index: 100; backdrop-filter: blur(10px); }
        .hdr h1 { font-size: 15px; font-weight: 700; color: var(--accent); }
        .back { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--accent); font-size: 22px; cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .back:active { background: var(--pink2); }
        .btn { padding: 9px 18px; border-radius: 22px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease 0s; font-family: var(--font); display: inline-flex; align-items: center; gap: 5px; justify-content: center; }
        .btn:active { transform: scale(0.97); }
        .btn-p { background: linear-gradient(135deg, rgb(244, 167, 176), rgb(240, 138, 150)); color: rgb(255, 255, 255); }
        .btn-o { background: var(--card); border: 1.5px solid var(--border); color: var(--text); }
        .btn-s { padding: 5px 12px; font-size: 10px; }
        .btn-full { width: 100%; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .fg { margin-bottom: 12px; }
        .fl { font-size: 10px; color: var(--text2); margin-bottom: 4px; display: block; font-weight: 600; }
        .fi, .fs, .ft { width: 100%; padding: 9px 12px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--bg2); color: var(--text); font-size: 12px; font-family: var(--font); outline: none; transition: border-color 0.2s ease 0s; }
        .fi:focus, .fs:focus, .ft:focus { border-color: var(--accent); }
        .ft { min-height: 50px; resize: vertical; }
        .home { flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 24px; text-align: center; background: linear-gradient(rgb(255, 247, 245), rgb(255, 240, 237) 40%, rgb(254, 245, 240) 70%, rgb(255, 247, 245)); }
        .home-logo { font-size: 52px; animation: 3s ease-in-out 0s infinite normal none running float; margin-bottom: 6px; }
        .home-t { font-size: 22px; font-weight: 800; color: var(--text); }
        .home-st { font-size: 11px; color: var(--text2); margin: 5px 0px 22px; line-height: 1.7; }
        .home-btn { width: 100%; max-width: 280px; padding: 13px 18px; border-radius: 22px; border: 1.5px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 9px; display: flex; align-items: center; gap: 8px; justify-content: center; transition: all 0.2s ease 0s; box-shadow: var(--shadow); font-family: var(--font); }
        .home-btn:active { transform: scale(0.97); }
        .home-btn.pri { background: linear-gradient(135deg,var(--accent),#f08a96); color: rgb(255, 255, 255); border-color: var(--accent); }
        .story-text { font-size: 12px; line-height: 1.9; color: var(--text); white-space: pre-wrap; overflow-wrap: break-word; }
        .nav { position: fixed; bottom: 0px; left: 0px; right: 0px; background: var(--card); border-top: 1px solid var(--border); display: none; padding: 4px 0 env(safe-area-inset-bottom,6px); z-index: 200; box-shadow: rgba(244, 167, 176, 0.08) 0px -2px 10px; }
        .nav.show { display: flex; }
        .nav-i { flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; padding: 4px 1px; cursor: pointer; gap: 1px; border-radius: 10px; margin: 0px 1px; position: relative; }
        .nav-i:active { background: var(--pink2); }
        .nav-i.act .nav-ico, .nav-i.act .nav-lb { color: var(--accent); }
        .nav-ico { font-size: 18px; color: var(--text2); transition: color 0.2s ease 0s; }
        .nav-lb { font-size: 8px; color: var(--text2); font-weight: 600; }
        .game-body { flex: 1 1 0%; overflow-y: auto; padding-bottom: 64px; }
        .tab-page { display: none; animation: 0.3s ease 0s 1 normal none running fadeIn; }
        .tab-page.active { display: block; }
    </style>
</head>
<body>

<!-- HTML Structure -->
<div class="lo-ov" id="loadOv"><div class="lo-sp"></div><div class="lo-t" id="loadTxt">AI 正在编织命运...</div></div>

<div class="screen active" id="scrHome">
    <div class="home" style="min-height:100vh">
        <div class="home-logo">🌌</div>
        <div class="home-t">KALIDA</div>
        <div style="font-size:12px;color:var(--accent);margin:3px 0;font-weight:600">通用世界观模拟器</div>
        <div class="home-st">"创造你的世界，书写你的故事。"<br>☁️ 无限世界 · 无限可能 · 等你探索 ☁️</div>
        <button class="home-btn pri" data-target="scrCC">🎮 开始新游戏</button>
        <button class="home-btn" data-target="scrSave">💾 存档 / 读档</button>
        <button class="home-btn" data-target="scrPrompt">📝 高级设定 (Prompt)</button>
        <button class="home-btn" data-target="scrApi">🔌 API 配置</button>
        <div style="font-size:9px;color:var(--text3);margin-top:18px">v1.1 · 🌌 Universal Engine</div>
    </div>
</div>

<div class="screen" id="scrApi">
    <div class="hdr"><button class="back">‹</button><h1>🔌 API 配置</h1></div>
    <div style="flex:1;overflow-y:auto;padding-bottom:16px">
        <div class="cloud nt">
            <div class="fg"><label class="fl">Base URL</label><input class="fi" id="apiUrl" placeholder="https://api.openai.com/v1"></div>
            <div class="fg"><label class="fl">API Key</label><input class="fi" id="apiKey" type="password" placeholder="sk-xxxxxx"></div>
            <div class="fg">
                <label class="fl">Model</label>
                <div style="display:flex;gap:5px">
                    <select class="fs" id="apiSel" style="flex:1"><option value="">--点击右侧按钮拉取--</option></select>
                    <button id="apiRefreshBtn" class="btn btn-o btn-s">🔄</button>
                </div>
            </div>
            <div class="fg">
                <label class="fl">或手动输入模型</label>
                <input class="fi" id="apiModel" placeholder="当上方未选择时，将使用此处的模型">
            </div>
        </div>
    </div>
</div>

<div class="screen" id="scrPrompt">
    <div class="hdr"><button class="back">‹</button><h1>📝 高级设定 (Prompt)</h1></div>
    <div style="flex:1;overflow-y:auto;padding-bottom:16px">
        <div class="cloud nt">
            <div class="cloud-t">📜 核心设定条目</div>
            <p style="font-size:11px; color:var(--text2); margin-bottom:12px;">这里的设定将作为System Prompt发送给AI。勾选以启用。</p>
            <div class="fg">
                <label class="fl" style="display:flex; align-items:center; gap:6px;"><input type="checkbox" id="promptWorldviewToggle" checked>世界观 (Worldview)</label>
                <textarea class="ft" id="promptWorldview" rows="5" placeholder="描述你的世界背景、规则、历史、文化..."></textarea>
            </div>
            <div class="fg">
                <label class="fl" style="display:flex; align-items:center; gap:6px;"><input type="checkbox" id="promptCharToggle" checked>角色设定 (Character)</label>
                <textarea class="ft" id="promptChar" rows="3" placeholder="描述你的角色身份、性格、目标..."></textarea>
            </div>
            <div class="fg">
                <label class="fl" style="display:flex; align-items:center; gap:6px;"><input type="checkbox" id="promptStyleToggle">文风指导 (Style Guide)</label>
                <textarea class="ft" id="promptStyle" rows="2" placeholder="例如：请使用轻松幽默的口吻，或者“村上春树”式的风格。"></textarea>
            </div>
        </div>
    </div>
</div>

<div class="screen" id="scrSave">
    <div class="hdr"><button class="back">‹</button><h1>💾 存档管理</h1></div>
    <div style="flex:1;overflow-y:auto;padding-bottom:16px"><div class="cloud nt" id="saveSlots"></div></div>
</div>

<div class="screen" id="scrCC">
    <div class="hdr"><button class="back">‹</button><h1>🎭 世界观构建</h1></div>
    <div style="flex:1;overflow-y:auto;padding-bottom:16px" id="ccBox">
        <div class="cloud">
            <div class="cloud-t">第一步：定义你的世界</div>
            <div class="fg">
                <label class="fl">世界名称</label>
                <input class="fi" id="worldNameInput" placeholder="例如：赛博都市“夜之城”">
            </div>
            <div class="fg">
                <label class="fl">核心背景设定</label>
                <textarea class="ft" id="worldBgInput" rows="6" placeholder="详细描述这个世界的基础规则、历史、科技/魔法水平、文化风俗等。AI 将严格遵守这里的设定。"></textarea>
            </div>
            <div class="fg">
                <label class="fl">你的身份</label>
                <input class="fi" id="charIdentityInput" placeholder="例如：一个刚入行的记者、被流放的精灵王子...">
            </div>
             <button id="startGameBtn" class="btn btn-p btn-full">开启我的故事 →</button>
        </div>
    </div>
</div>

<div class="screen" id="scrGame">
    <div class="hdr" style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:linear-gradient(135deg,#fff5f7,#fff0f3)">
        <div style="font-size:13px;font-weight:700;color:var(--accent)">KALIDA</div>
    </div>
    <div class="game-body" id="gameBody">
        <div class="tab-page active" id="tabStory">
            <div class="cloud"><div class="story-text" id="storyTextContainer">你的故事将在这里展开...</div></div>
        </div>
        <div class="tab-page" id="tabChar"><div class="cloud">人物属性界面</div></div>
        <div class="tab-page" id="tabSocial"><div class="cloud">社交/论坛界面</div></div>
        <div class="tab-page" id="tabBag"><div class="cloud">行李箱界面</div></div>
        <div class="tab-page" id="tabPhone"><div class="cloud">手机/聊天界面</div></div>
        <div class="tab-page" id="tabEnding"><div class="cloud">结局界面</div></div>
    </div>
    <div class="nav" id="mainNav">
        <div class="nav-i act" data-target="tabStory"><span class="nav-ico">📖</span><span class="nav-lb">动态</span></div>
        <div class="nav-i" data-target="tabChar"><span class="nav-ico">👤</span><span class="nav-lb">人物</span></div>
        <div class="nav-i" data-target="tabSocial"><span class="nav-ico">👥</span><span class="nav-lb">社交</span></div>
        <div class="nav-i" data-target="tabBag"><span class="nav-ico">🧳</span><span class="nav-lb">行李箱</span></div>
        <div class="nav-i" data-target="tabPhone"><span class="nav-ico">📱</span><span class="nav-lb">手机</span></div>
        <div class="nav-i" data-target="tabEnding"><span class="nav-ico">🏆</span><span class="nav-lb">结局</span></div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- UI Elements ---
    const allScreens = document.querySelectorAll('.screen');
    const allTabPages = document.querySelectorAll('.tab-page');
    const mainNav = document.getElementById('mainNav');
    const loadOverlay = document.getElementById('loadOv');

    // API and World Creation Inputs
    const apiUrlInput = document.getElementById('apiUrl');
    const apiKeyInput = document.getElementById('apiKey');
    const apiSel = document.getElementById('apiSel');
    const apiModelInput = document.getElementById('apiModel');
    const apiRefreshBtn = document.getElementById('apiRefreshBtn');

    const worldNameInput = document.getElementById('worldNameInput');
    const worldBgInput = document.getElementById('worldBgInput');
    const charIdentityInput = document.getElementById('charIdentityInput');
    const startGameBtn = document.getElementById('startGameBtn');
    const storyTextContainer = document.getElementById('storyTextContainer');

    // --- Navigation Logic ---
    function showScreen(screenId) {
        allScreens.forEach(screen => screen.classList.remove('active'));
        const targetScreen = document.getElementById(screenId);
        if(targetScreen) targetScreen.classList.add('active');
        
        if (screenId === 'scrGame') mainNav.classList.add('show');
        else mainNav.classList.remove('show');
    }

    function showTabPage(tabPageId) {
        allTabPages.forEach(page => page.classList.remove('active'));
        const targetPage = document.getElementById(tabPageId);
        if(targetPage) targetPage.classList.add('active');
    }

    document.querySelectorAll('[data-target]').forEach(element => {
        element.addEventListener('click', () => {
            const targetId = element.getAttribute('data-target');
            if (document.getElementById(targetId)?.classList.contains('screen')) {
                showScreen(targetId);
            }
        });
    });

    document.querySelectorAll('.back').forEach(button => {
        button.addEventListener('click', () => showScreen('scrHome'));
    });

    if (mainNav) {
        mainNav.addEventListener('click', (e) => {
            const navItem = e.target.closest('.nav-i');
            if (!navItem) return;
            mainNav.querySelectorAll('.nav-i').forEach(item => item.classList.remove('act'));
            navItem.classList.add('act');
            showTabPage(navItem.getAttribute('data-target'));
        });
    }

    // --- NEW: Fetch Models Logic ---
    async function fetchModels() {
        const apiUrl = apiUrlInput.value.trim();
        const apiKey = apiKeyInput.value.trim();

        if (!apiUrl || !apiKey) {
            alert('请先填写 Base URL 和 API Key！');
            return;
        }

        const originalBtnText = apiRefreshBtn.innerHTML;
        apiRefreshBtn.innerHTML = '...';
        apiRefreshBtn.disabled = true;

        try {
            const response = await fetch(`${apiUrl}/models`, {
                headers: { 'Authorization': `Bearer ${apiKey}` }
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(`无法获取模型列表: ${response.status} ${response.statusText}. ${errData.error?.message || ''}`);
            }

            const data = await response.json();
            
            apiSel.innerHTML = '<option value="">--请选择一个模型--</option>'; // Clear previous options

            if (data.data && Array.isArray(data.data)) {
                 // Sort models alphabetically for better readability
                const models = data.data.map(m => m.id).sort();

                models.forEach(modelId => {
                    const option = document.createElement('option');
                    option.value = modelId;
                    option.textContent = modelId;
                    apiSel.appendChild(option);
                });
                alert('模型列表已成功刷新！');
            } else {
                 throw new Error("API返回的数据格式不正确，缺少'data'数组。");
            }
        } catch (error) {
            console.error('Fetch models failed:', error);
            alert(`刷新模型列表失败: ${error.message}`);
            apiSel.innerHTML = '<option value="">--拉取失败,请重试--</option>';
        } finally {
            apiRefreshBtn.innerHTML = originalBtnText;
            apiRefreshBtn.disabled = false;
        }
    }
    
    if (apiRefreshBtn) {
        apiRefreshBtn.addEventListener('click', fetchModels);
    }


    // --- Game Logic ---
    async function handleStartGame() {
        // 1. Get API configuration
        const apiUrl = apiUrlInput.value.trim();
        const apiKey = apiKeyInput.value.trim();
        
        // --- UPDATED: Smart model selection ---
        const selectedModel = apiSel.value;
        const manualModel = apiModelInput.value.trim();
        const modelToUse = selectedModel || manualModel;

        if (!apiUrl || !apiKey) {
            alert('请先在 "API配置" 页面填写完整的 Base URL 和 API Key！');
            showScreen('scrApi');
            return;
        }
        if (!modelToUse) {
            alert('请在 "API配置" 页面选择或手动输入一个模型！');
            showScreen('scrApi');
            return;
        }

        // 2. Get world creation data
        const worldName = worldNameInput.value;
        const worldBg = worldBgInput.value;
        const charIdentity = charIdentityInput.value;

        if (!worldName || !worldBg || !charIdentity) {
            alert('请填写完整的世界名称、核心背景设定和你的身份！');
            return;
        }

        // 3. Show loading overlay
        loadOverlay.classList.add('show');

        // 4. Construct the prompt
        const systemPrompt = `你是一个世界一流的互动小说引擎。请严格遵守以下设定，不要偏离。
        【世界观: ${worldName}】
        ${worldBg}
        `;
        const userPrompt = `我，玩家，将扮演以下角色：【${charIdentity}】。
        现在，请为我生成这个故事的开端。请用一段富有吸引力的描述，直接开始故事，让我能立刻沉浸其中。不要使用任何“好的”、“当然”之类的开场白。`;

        // 5. Call the API
        try {
            const response = await fetch(`${apiUrl}/chat/completions`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: modelToUse,
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: userPrompt }
                    ],
                    stream: false
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(`API Error: ${response.status} - ${errorData.error?.message || JSON.stringify(errorData)}`);
            }

            const data = await response.json();
            const storyText = data.choices[0].message.content;

            // 6. Update UI
            storyTextContainer.innerText = storyText.trim();
            showScreen('scrGame');
            showTabPage('tabStory');
            mainNav.querySelector('.nav-i.act')?.classList.remove('act');
            mainNav.querySelector('[data-target="tabStory"]')?.classList.add('act');
        } catch (error) {
            console.error('API call failed:', error);
            alert(`调用API失败: ${error.message}`);
        } finally {
            // 7. Hide loading overlay
            loadOverlay.classList.remove('show');
        }
    }

    if (startGameBtn) {
        startGameBtn.addEventListener('click', handleStartGame);
    }
});
</script>

</body>
</html>
