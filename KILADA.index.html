<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KILIDIA · 自定义叙事模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #fef9f5;
            --bg2: #fff7f2;
            --card: #ffffff;
            --card2: #fff5ef;
            --accent: #c9a9e6;
            --accent2: #d9b8f0;
            --accent3: #ffd89e;
            --accent4: #b8ddb5;
            --text: #4a3f3a;
            --text2: #b5a59a;
            --text3: #d4c8be;
            --border: #f0e0da;
            --border2: #e6d6d0;
            --shadow: 0 2px 12px rgba(201, 169, 230, 0.12);
            --shadow2: 0 4px 20px rgba(201, 169, 230, 0.18);
            --pink: #f5eefc;
            --pink2: #f9f3ff;
            --pink3: #eddaf9;
            --blue: #e8f2fc;
            --green: #e5f5e0;
            --yellow: #fef8e0;
            --r: 18px;
            --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
            --fs: 14px;
        }

        body {
            font-family: var(--font);
            font-size: var(--fs);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .screen {
            display: none;
            min-height: 100vh;
        }
        .screen.active { display: flex; flex-direction: column; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
        @keyframes slideUp { from { opacity: 0; transform: translateY(16px);} to { opacity: 1; transform: translateY(0);} }
        @keyframes float { 0%, 100% { transform: translateY(0);} 50% { transform: translateY(-5px);} }
        @keyframes spin { to { transform: rotate(360deg);} }
        @keyframes popIn { from { transform: scale(0.85); opacity: 0;} to { transform: scale(1); opacity: 1;} }

        .cloud {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: 22px;
            margin: 8px 14px;
            padding: 14px;
            box-shadow: var(--shadow);
            animation: slideUp 0.4s ease;
        }
        .cloud-t {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hdr {
            background: linear-gradient(135deg, #faf5ff, #f5edfc);
            padding: 14px 16px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .hdr h1 { font-size: 15px; font-weight: 700; color: var(--accent); }
        .back {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--accent);
            font-size: 22px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back:active { background: var(--pink2);}

        .btn {
            padding: 9px 18px;
            border-radius: 22px;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            justify-content: center;
            font-family: var(--font);
        }
        .btn:active { transform: scale(0.97);}
        .btn-p { background: linear-gradient(135deg, #c9a9e6, #b38fd9); color: white;}
        .btn-g { background: linear-gradient(135deg, #8dd48a, #6bc467); color: white;}
        .btn-o { background: var(--card); border: 1.5px solid var(--border); color: var(--text);}
        .btn-s { padding: 5px 12px; font-size: 10px;}
        .btn-full { width: 100%;}

        .fg { margin-bottom: 12px; }
        .fl { font-size: 10px; color: var(--text2); margin-bottom: 4px; display: block; font-weight: 600;}
        .fi, .fs, .ft { width: 100%; padding: 9px 12px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--bg2); color: var(--text); font-size: 12px; outline: none; font-family: var(--font);}
        .fi:focus, .fs:focus { border-color: var(--accent); }
        .ft { min-height: 100px; resize: vertical; }

        .lo-ov {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(254, 249, 245, 0.92);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            backdrop-filter: blur(4px);
        }
        .lo-ov.show { display: flex; }
        .lo-sp { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        .lo-t { font-size: 12px; color: var(--text2); }

        .toast {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            padding: 9px 20px;
            border-radius: 22px;
            font-size: 11px;
            font-weight: 600;
            z-index: 10000;
            animation: popIn 0.3s ease;
            max-width: 90%;
            box-shadow: var(--shadow2);
        }
        .toast.ok { background: #e5f5e0; color: #3a7a3a; border: 1px solid #c8e6c5; }
        .toast.err { background: #fff0f3; color: #c05050; border: 1px solid #f4c4c3; }
        .toast.info { background: var(--pink2); color: #a06070; border: 1px solid #f5d0d8; }

        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            border-top: 1px solid var(--border);
            display: none;
            padding: 4px 0 env(safe-area-inset-bottom, 6px);
            z-index: 200;
        }
        .nav.show { display: flex; }
        .nav-i {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 1px;
            cursor: pointer;
            gap: 1px;
            border-radius: 10px;
        }
        .nav-i:active { background: var(--pink2);}
        .nav-i.act .nav-ico, .nav-i.act .nav-lb { color: var(--accent);}
        .nav-ico { font-size: 18px; color: var(--text2);}
        .nav-lb { font-size: 8px; color: var(--text2); font-weight: 600;}

        .game-body { flex: 1; overflow-y: auto; padding-bottom: 64px; }
        .tab-page { display: none; animation: fadeIn 0.3s ease; }
        .tab-page.active { display: block; }

        .sb-bg { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
        .sb { height: 100%; border-radius: 2px; transition: width 0.5s; }
        .sb.hi { background: linear-gradient(90deg, #b8ddb5, #8dd48a); }
        .sb.mi { background: linear-gradient(90deg, #ffd89e, #f0c060); }
        .sb.lo { background: linear-gradient(90deg, #d9b8f0, #c49be0); }

        .status-pill { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 3px 10px; display: inline-flex; align-items: center; gap: 3px; font-size: 9px; margin-right: 6px; margin-bottom: 4px;}
        .story-text { font-size: 12px; line-height: 1.9; white-space: pre-wrap; word-break: break-word; }

        .home {
            flex:1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 24px;
            text-align: center;
            background: linear-gradient(#faf5ff, #f5edfc);
        }
        .home-logo { font-size: 52px; animation: float 3s ease-in-out infinite; margin-bottom: 6px; }
        .home-t { font-size: 22px; font-weight: 800; }
        .home-t span { color: var(--accent); }
        .home-st { font-size: 11px; color: var(--text2); margin: 5px 0 22px; line-height: 1.7; }
        .home-btn {
            width: 100%;
            max-width: 280px;
            padding: 13px 18px;
            border-radius: 22px;
            border: 1.5px solid var(--border);
            background: var(--card);
            margin-bottom: 9px;
            font-weight: 600;
            cursor: pointer;
        }
        .home-btn.pri { background: linear-gradient(135deg, var(--accent), #b38fd9); color: white; border-color: var(--accent);}

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.28); z-index: 500; display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(3px);
        }
        .modal-overlay.show { display: flex; }
        .modal-box { background: var(--card); border-radius: 22px; max-width: 360px; width: 100%; max-height: 82vh; overflow-y: auto; padding: 20px; animation: popIn 0.3s; border: 1.5px solid var(--border); }

        .slider-row { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
        .slider-row label { flex: 1; font-size: 11px; font-weight: 600; }
        input[type="range"] { flex: 2; accent-color: var(--accent); }
        .preset-item { padding: 10px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 6px; cursor: pointer; background: var(--bg2); }
        .preset-item:active { background: var(--pink2); border-color: var(--accent);}
    </style>
</head>
<body>

<div class="lo-ov" id="loadOv"><div style="font-size:22px;animation:float 2s ease-in-out infinite">🪄✨</div><div class="lo-sp"></div><div class="lo-t" id="loadTxt">加载模拟器配置...</div></div>
<div class="modal-overlay" id="profileModal"><div class="modal-box" id="profileBox"></div></div>
<div class="menu-ov" id="menuOv" style="position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:400; display:none; align-items:flex-start; justify-content:flex-end; padding-top:45px; padding-right:10px;"><div class="menu-box" id="menuBox" style="background:var(--card); border-radius:18px; min-width:200px;"></div></div>

<!-- 主界面 -->
<div class="screen active" id="scrHome">
    <div class="home">
        <div class="home-logo">🪄✨</div>
        <div class="home-t">KILIDIA · <span>叙事模拟器</span></div>
        <div class="home-st">"自定义世界观 · 动态叙事引擎 · 无限可能"<br>☁️ 你的故事，由你定义 ☁️</div>
        <button class="home-btn pri" id="newGameBtn">🎮 开始新故事</button>
        <button class="home-btn" id="saveLoadBtn">💾 存档 / 读档</button>
        <button class="home-btn" id="simEditorBtn">⚙️ 模拟器编辑器</button>
        <button class="home-btn" id="apiConfigBtn">🔌 API & 酒馆预设</button>
        <div style="font-size:9px;color:var(--text3);margin-top:18px">v4.0 · 可编程叙事内核</div>
    </div>
</div>

<!-- API + 酒馆预设配置 -->
<div class="screen" id="scrApi">
    <div class="hdr"><button class="back">‹</button><h1>🔌 API & 酒馆预设</h1></div>
    <div style="flex:1;overflow-y:auto;padding-bottom:16px">
        <div class="cloud nt">
            <div class="cloud-t">🌐 大模型配置</div>
            <div class="fg"><label class="fl">Base URL</label><input class="fi" id="apiUrl" placeholder="https://api.openai.com/v1"></div>
            <div class="fg"><label class="fl">API Key</label><input class="fi" id="apiKey" type="password" placeholder="sk-xxxxxx"></div>
            <div class="fg"><label class="fl">Model</label><input class="fi" id="apiModel" placeholder="gpt-4o / claude-3-sonnet / 本地"></div>
        </div>
        <div class="cloud nt">
            <div class="cloud-t">🍷 酒馆风格预设 (SillyTavern)</div>
            <div class="slider-row"><label>🌡️ Temperature</label><input type="range" id="tempSlider" min="0" max="2" step="0.05" value="0.9"><span id="tempVal">0.90</span></div>
            <div class="slider-row"><label>🎲 Top P</label><input type="range" id="topPSlider" min="0" max="1" step="0.01" value="0.95"><span id="topPVal">0.95</span></div>
            <div class="slider-row"><label>📊 Top K</label><input type="range" id="topKSlider" min="0" max="100" step="1" value="40"><span id="topKVal">40</span></div>
            <div class="fg"><label class="fl">预设卡 (点击加载)</label>
                <div id="presetList"></div>
            </div>
            <div class="fg"><label class="fl">自定义系统提示词 (角色卡)</label><textarea class="ft" id="systemPrompt" rows="4" placeholder="你是叙事引擎，根据角色属性和事件池生成沉浸式剧情..."></textarea></div>
            <button class="btn btn-p btn-full" id="saveApiPresetBtn">💾 保存API & 预设</button>
        </div>
    </div>
</div>

<!-- 模拟器编辑器 - 核心自定义 -->
<div class="screen" id="scrSimEditor">
    <div class="hdr"><button class="back">‹</button><h1>⚙️ 模拟器编辑器</h1></div>
    <div style="flex:1;overflow-y:auto;padding-bottom:16px">
        <div class="cloud nt">
            <div class="cloud-t">📖 世界观设定</div>
            <textarea class="ft" id="worldDesc" rows="3" placeholder="例如：魔法学院、赛博朋克都市、异世界冒险..."></textarea>
        </div>
        <div class="cloud nt">
            <div class="cloud-t">🎲 自定义属性池 (JSON格式)</div>
            <textarea class="ft" id="customStatsDef" rows="6" placeholder='{"health":{"label":"❤️ 生命","min":0,"max":100,"default":80},"magic":{"label":"✨ 魔力","min":0,"max":100,"default":50}}'></textarea>
            <div style="font-size:9px;color:var(--text2);margin-top:4px">💡 每个属性自动生成进度条，游戏内可动态增减</div>
        </div>
        <div class="cloud nt">
            <div class="cloud-t">✨ 事件池 (每行一个事件模板)</div>
            <textarea class="ft" id="eventPool" rows="8" placeholder='{text:"📚 在图书馆偶遇神秘导师", effects:{"academic":3,"mental":2}}
{text:"🌙 深夜灵感涌现", effects:{"magic":5,"health":-1}}
支持变量，可用 {{name}} {{year}} 等'></textarea>
        </div>
        <div class="cloud nt">
            <div class="cloud-t">🏁 结局条件 (JSON)</div>
            <textarea class="ft" id="endingConditions" rows="5" placeholder='[{"name":"传奇法师","condition":{"magic":90},"desc":"魔力超越90，成为大法师"},{"name":"社畜结局","condition":{"money":0},"desc":"破产归乡"}]'></textarea>
        </div>
        <button class="btn btn-p btn-full" id="saveSimulatorConfig">💾 保存模拟器配置</button>
        <button class="btn btn-o btn-full" id="resetDefaultConfig" style="margin-top:8px">🔄 恢复默认留学模拟器</button>
    </div>
</div>

<!-- 存档管理 -->
<div class="screen" id="scrSave"><div class="hdr"><button class="back">‹</button><h1>💾 存档管理</h1></div><div class="cloud nt" id="saveSlots"></div><div class="cloud nt"><button class="btn btn-o btn-full" id="exportSaveBtn">📤 导出存档</button><button class="btn btn-o btn-full" id="importSaveBtn">📥 导入存档</button><input type="file" id="importFile" accept=".json" style="display:none"></div></div>

<!-- 角色创建 -->
<div class="screen" id="scrCC"><div class="hdr"><button class="back">‹</button><h1>🎭 角色创建</h1></div><div class="cc-dots" id="ccDots" style="display:flex;justify-content:center;gap:4px;margin:10px 0;"></div><div style="flex:1;overflow-y:auto;padding-bottom:16px" id="ccBox"></div></div>

<!-- 游戏主屏 -->
<div class="screen" id="scrGame">
    <div class="hdr" style="justify-content:space-between;display:flex;">
        <div style="font-weight:700;color:var(--accent)">🪄 KILIDIA · 叙事引擎</div>
        <button class="btn btn-o btn-s" id="gameMenuBtn">☰</button>
    </div>
    <div class="game-body" id="gameBody">
        <div class="tab-page active" id="tabStory"></div>
        <div class="tab-page" id="tabChar"></div>
        <div class="tab-page" id="tabSocial"></div>
        <div class="tab-page" id="tabBag"></div>
        <div class="tab-page" id="tabPhone"></div>
        <div class="tab-page" id="tabEnding"></div>
    </div>
    <div class="nav show" id="mainNav">
        <div class="nav-i act" data-tab="story"><span class="nav-ico">📖</span><span class="nav-lb">动态</span></div>
        <div class="nav-i" data-tab="char"><span class="nav-ico">👤</span><span class="nav-lb">人物</span></div>
        <div class="nav-i" data-tab="social"><span class="nav-ico">👥</span><span class="nav-lb">社交</span></div>
        <div class="nav-i" data-tab="bag"><span class="nav-ico">🧳</span><span class="nav-lb">行囊</span></div>
        <div class="nav-i" data-tab="phone"><span class="nav-ico">📱</span><span class="nav-lb">手机</span></div>
        <div class="nav-i" data-tab="ending"><span class="nav-ico">🏆</span><span class="nav-lb">结局</span></div>
    </div>
</div>

<script>
    (function(){
        // ---------- 核心存储 ----------
        let simConfig = {  // 模拟器配置 (自动保存)
            worldDesc: "一个充满魔法与抉择的异世界，留学只是开始……",
            customStats: { "health": {"label":"❤️ 生命","min":0,"max":100,"default":80}, "mental": {"label":"🧠 心智","min":0,"max":100,"default":70}, "academic": {"label":"📚 学识","min":0,"max":100,"default":50} },
            eventPool: [
                {text:"✨ 奇遇：路边捡到神秘卷轴", effects:{"academic":3,"mental":2}},
                {text:"🌙 深夜失眠，思考人生意义", effects:{"mental":-3,"health":-1}},
                {text:"🤝 结交新朋友，畅谈理想", effects:{"social":4,"mental":2}},
                {text:"💼 兼职打工赚了些钱", effects:{"money":300,"health":-2}},
                {text:"📖 图书馆通宵学习", effects:{"academic":5,"mental":-4}}
            ],
            endingConditions: [
                {name:"🌟 传奇学者", condition:{"academic":90}, desc:"学识登峰造极"},
                {name:"💔 崩溃边缘", condition:{"mental":20}, desc:"精神崩溃，放弃旅程"}
            ]
        };
        
        let apiPreset = { baseUrl: "", apiKey: "", model: "gpt-4o", temperature: 0.9, top_p: 0.95, top_k: 40, systemPrompt: "你是 KILIDIA 叙事引擎，根据角色状态和事件池生成富有沉浸感的剧情片段。使用第二人称，风格文艺且带有神秘感。" };
        let game = null;
        let currentScreen = "scrHome";
        let currentTab = "story";
        
        // 加载/保存所有配置
        function loadAllConfigs(){
            let savedSim = localStorage.getItem("kilidia_simulator_config");
            if(savedSim) try{ simConfig = JSON.parse(savedSim); }catch(e){}
            let savedApi = localStorage.getItem("kilidia_api_preset");
            if(savedApi) try{ apiPreset = JSON.parse(savedApi); }catch(e){}
            // 同步UI
            document.getElementById("worldDesc") && (document.getElementById("worldDesc").value = simConfig.worldDesc || "");
            document.getElementById("customStatsDef") && (document.getElementById("customStatsDef").value = JSON.stringify(simConfig.customStats, null, 2));
            document.getElementById("eventPool") && (document.getElementById("eventPool").value = simConfig.eventPool.map(e=>JSON.stringify(e)).join("\n"));
            document.getElementById("endingConditions") && (document.getElementById("endingConditions").value = JSON.stringify(simConfig.endingConditions, null, 2));
            document.getElementById("apiUrl") && (document.getElementById("apiUrl").value = apiPreset.baseUrl || "");
            document.getElementById("apiKey") && (document.getElementById("apiKey").value = apiPreset.apiKey || "");
            document.getElementById("apiModel") && (document.getElementById("apiModel").value = apiPreset.model || "");
            document.getElementById("tempSlider") && (document.getElementById("tempSlider").value = apiPreset.temperature);
            document.getElementById("topPSlider") && (document.getElementById("topPSlider").value = apiPreset.top_p);
            document.getElementById("topKSlider") && (document.getElementById("topKSlider").value = apiPreset.top_k);
            document.getElementById("systemPrompt") && (document.getElementById("systemPrompt").value = apiPreset.systemPrompt);
            updateSliderDisplay();
        }
        
        function saveSimulatorConfig(){
            try{
                simConfig.worldDesc = document.getElementById("worldDesc").value;
                simConfig.customStats = JSON.parse(document.getElementById("customStatsDef").value);
                let eventLines = document.getElementById("eventPool").value.split("\n").filter(l=>l.trim());
                simConfig.eventPool = eventLines.map(l=>JSON.parse(l));
                simConfig.endingConditions = JSON.parse(document.getElementById("endingConditions").value);
                localStorage.setItem("kilidia_simulator_config", JSON.stringify(simConfig));
                showToast("模拟器配置已保存", "ok");
            }catch(e){ showToast("JSON格式错误: "+e.message, "err"); }
        }
        
        function saveApiPreset(){
            apiPreset.baseUrl = document.getElementById("apiUrl").value;
            apiPreset.apiKey = document.getElementById("apiKey").value;
            apiPreset.model = document.getElementById("apiModel").value;
            apiPreset.temperature = parseFloat(document.getElementById("tempSlider").value);
            apiPreset.top_p = parseFloat(document.getElementById("topPSlider").value);
            apiPreset.top_k = parseInt(document.getElementById("topKSlider").value);
            apiPreset.systemPrompt = document.getElementById("systemPrompt").value;
            localStorage.setItem("kilidia_api_preset", JSON.stringify(apiPreset));
            showToast("API & 酒馆预设已保存", "ok");
        }
        
        function updateSliderDisplay(){
            document.getElementById("tempVal") && (document.getElementById("tempVal").innerText = document.getElementById("tempSlider").value);
            document.getElementById("topPVal") && (document.getElementById("topPVal").innerText = document.getElementById("topPSlider").value);
            document.getElementById("topKVal") && (document.getElementById("topKVal").innerText = document.getElementById("topKSlider").value);
        }
        
        // 酒馆预设列表
        const tavernPresets = {
            "📖 沉稳叙事者": {temp:0.7, top_p:0.9, top_k:30, sys:"沉静细腻的叙事风格，注重内心描写"},
            "🎭 戏剧诗人": {temp:1.2, top_p:0.96, top_k:50, sys:"华丽、充满比喻和情感张力"},
            "⚡ 快节奏爽文": {temp:0.85, top_p:0.92, top_k:60, sys:"节奏明快，对话生动，爽点密集"},
            "🕯️ 黑暗哥特": {temp:1.0, top_p:0.88, top_k:45, sys:"阴郁神秘，带有悬疑和隐喻"}
        };
        
        function renderPresetList(){
            let container = document.getElementById("presetList");
            if(!container) return;
            container.innerHTML = "";
            for(let [name, preset] of Object.entries(tavernPresets)){
                let div = document.createElement("div");
                div.className = "preset-item";
                div.innerText = name;
                div.onclick = ()=>{
                    document.getElementById("tempSlider").value = preset.temp;
                    document.getElementById("topPSlider").value = preset.top_p;
                    document.getElementById("topKSlider").value = preset.top_k;
                    document.getElementById("systemPrompt").value = preset.sys;
                    updateSliderDisplay();
                    showToast(`已加载预设: ${name}`, "info");
                };
                container.appendChild(div);
            }
        }
        
        // 新游戏初始化 (使用自定义属性)
        function initNewGame(name, extraTraits){
            let stats = {};
            for(let [key, def] of Object.entries(simConfig.customStats)){
                stats[key] = def.default;
            }
            stats.money = 2500;
            stats.social = 60;
            return {
                version:2,
                player: { name: name, year:1, semester:1, ...stats, traits: extraTraits || [] },
                inventory: ["学生证", "手机", "护照"],
                relationships: {},
                storyLog: [`✨ ${name} 踏入「${simConfig.worldDesc || '未知世界'}」\n带着梦想与忐忑，故事开始了。`],
                unlockedEndings: [],
                flags: {}
            };
        }
        
        // 每周模拟（基于自定义事件池）
        function simulateWeek(){
            if(!game) return;
            let p = game.player;
            // 随机事件
            let event = simConfig.eventPool[Math.floor(Math.random() * simConfig.eventPool.length)];
            if(event){
                let effectText = [];
                for(let [stat, delta] of Object.entries(event.effects)){
                    if(p[stat] !== undefined){
                        let def = simConfig.customStats[stat];
                        let newVal = (p[stat] || 0) + delta;
                        if(def){ newVal = Math.min(def.max, Math.max(def.min, newVal)); }
                        else { newVal = Math.min(100, Math.max(0, newVal)); }
                        p[stat] = newVal;
                        effectText.push(`${delta>0?'+':''}${delta} ${stat}`);
                    }else if(stat === "money"){
                        p.money = Math.max(0, (p.money||0) + delta);
                        effectText.push(`${delta>0?'+':''}${delta}💰`);
                    }
                }
                let eventMsg = event.text.replace(/\{\{name\}\}/g, p.name).replace(/\{\{year\}\}/g, p.year);
                game.storyLog.unshift(`📅 第${p.year}年·学期${p.semester}周: ${eventMsg} (${effectText.join(", ")})`);
            } else {
                game.storyLog.unshift(`📅 平凡的一周，${p.name} 在异乡慢慢适应。`);
            }
            if(game.storyLog.length > 30) game.storyLog.pop();
            p.semester++;
            if(p.semester > 2){ p.semester = 1; p.year++; if(p.year>5){ game.storyLog.unshift("🏆 五年旅程结束，结局计算中..."); saveGameToLocal(); checkEnding(); return; } }
            saveGameToLocal();
            refreshAllTabs();
            showToast("时光流转，新的一页", "ok");
        }
        
        function checkEnding(){
            if(!game) return;
            let p = game.player;
            for(let end of simConfig.endingConditions){
                let match = true;
                for(let [key, val] of Object.entries(end.condition)){
                    if((p[key] || 0) < val) match = false;
                }
                if(match && !game.unlockedEndings.includes(end.name)){
                    game.unlockedEndings.push(end.name);
                    game.storyLog.unshift(`🏆 结局解锁: ${end.name} - ${end.desc}`);
                    showToast(`✨ 新结局: ${end.name}`, "info");
                    saveGameToLocal();
                    renderEndingTab();
                }
            }
        }
        
        function saveGameToLocal(){ if(game) localStorage.setItem("kilidia_game_save", JSON.stringify(game)); }
        function loadGameFromLocal(){ let raw = localStorage.getItem("kilidia_game_save"); if(raw){ try{ game = JSON.parse(raw); return true; }catch(e){} } return false; }
        
        // UI渲染函数 (动态属性渲染)
        function renderCharTab(){
            let container = document.getElementById('tabChar');
            if(!container || !game) return;
            let p = game.player;
            let statsHtml = "";
            for(let [key, def] of Object.entries(simConfig.customStats)){
                let val = p[key] || def.default;
                let barClass = val>60?'hi':(val>30?'mi':'lo');
                statsHtml += `<div class="fg"><div>${def.label} ${val}</div><div class="sb-bg"><div class="sb ${barClass}" style="width:${val}%"></div></div></div>`;
            }
            statsHtml += `<div class="fg"><div>💰 资金 ${p.money||0}</div><div class="sb-bg"><div class="sb mi" style="width:${Math.min(100,(p.money||0)/50)}%"></div></div></div>`;
            statsHtml += `<div class="fg"><div>👥 社交 ${p.social||60}</div><div class="sb-bg"><div class="sb hi" style="width:${p.social||60}%"></div></div></div>`;
            container.innerHTML = `<div class="cloud"><div class="cloud-t">👤 ${p.name}</div>${statsHtml}<div class="divider"></div><div>📖 世界观: ${simConfig.worldDesc}</div></div>`;
        }
        
        function renderStoryTab(){
            let container = document.getElementById('tabStory');
            if(!container || !game) return;
            let logsHtml = (game.storyLog || []).map(l=>`<div class="story-text">${l}</div><div class="divider"></div>`).join('');
            container.innerHTML = `<div class="status-bar" style="padding:6px 14px;"><span class="status-pill">📅 第${game.player.year}年·${game.player.semester}/2</span></div>
            <div class="cloud"><div class="cloud-t">📖 叙事流</div>${logsHtml}</div>
            <div style="display:flex; gap:8px; margin:12px 14px;"><button class="btn btn-p" id="nextWeekBtn">✨ 推进时间线</button><button class="btn btn-o" id="resetToHomeBtn">🏠 主菜单</button></div>`;
            document.getElementById('nextWeekBtn')?.addEventListener('click',()=> simulateWeek());
            document.getElementById('resetToHomeBtn')?.addEventListener('click',()=>{ if(game) saveGameToLocal(); showScreen('scrHome'); });
        }
        function renderSocialTab(){ document.getElementById('tabSocial').innerHTML = `<div class="cloud"><div class="cloud-t">👥 社交圈</div><div>当前同伴: 神秘向导 · 旧友来信</div><button class="btn btn-o">📱 社交互动</button></div>`; }
        function renderBagTab(){ document.getElementById('tabBag').innerHTML = `<div class="cloud"><div class="cloud-t">🧳 行囊</div><div>${(game?.inventory||[]).map(i=>`📦 ${i}`).join(' ')||'空空'}</div></div>`; }
        function renderPhoneTab(){ document.getElementById('tabPhone').innerHTML = `<div class="cloud"><div class="cloud-t">📱 终端</div><div>📞 通讯 · 🌐 网络 · 预设风格已生效</div></div>`; }
        function renderEndingTab(){ let ends = game?.unlockedEndings||[]; document.getElementById('tabEnding').innerHTML = `<div class="cloud"><div class="cloud-t">🏆 结局图鉴</div>${ends.map(e=>`<div class="status-pill">✨ ${e}</div>`).join('')||'尚未解锁结局'}</div>`; }
        function refreshAllTabs(){ renderStoryTab(); renderCharTab(); renderSocialTab(); renderBagTab(); renderPhoneTab(); renderEndingTab(); }
        function setActiveTab(tabId){ currentTab=tabId; document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active')); document.getElementById(`tab${tabId.charAt(0).toUpperCase()+tabId.slice(1)}`).classList.add('active'); document.querySelectorAll('.nav-i').forEach(btn=>btn.classList.remove('act')); document.querySelector(`.nav-i[data-tab="${tabId}"]`)?.classList.add('act'); refreshAllTabs(); }
        
        // 角色创建简化
        let stepIndex=0, charTemp={};
        function renderCreateStep(){
            let box=document.getElementById('ccBox');
            box.innerHTML=`<div class="cloud"><div class="cloud-t">你的名字</div><input class="fi" id="ccName" placeholder="冒险者之名"><button class="btn btn-p" id="ccFinish">开始叙事</button></div>`;
            document.getElementById('ccFinish')?.addEventListener('click',()=>{
                let name=document.getElementById('ccName').value.trim()||"无名人";
                game=initNewGame(name,[]);
                saveGameToLocal();
                showScreen('scrGame');
                refreshAllTabs();
                setActiveTab('story');
            });
        }
        
        // 事件绑定
        function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); currentScreen=id; }
        function showToast(msg,type){ let d=document.createElement('div'); d.className=`toast ${type}`; d.innerText=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),2000); }
        
        document.querySelectorAll('.back').forEach(btn=>btn.addEventListener('click',()=>showScreen('scrHome')));
        document.getElementById('newGameBtn')?.addEventListener('click',()=>{ showScreen('scrCC'); renderCreateStep(); });
        document.getElementById('saveLoadBtn')?.addEventListener('click',()=>{ showScreen('scrSave'); document.getElementById('saveSlots').innerHTML=`<button class="btn btn-o" id="manualSave">💾 保存当前</button><button class="btn btn-o" id="loadLast">📀 读取存档</button>`; document.getElementById('manualSave')?.addEventListener('click',()=>{ if(game){ saveGameToLocal(); showToast("已保存","ok");} }); document.getElementById('loadLast')?.addEventListener('click',()=>{ if(loadGameFromLocal()){ showToast("读取成功","ok"); showScreen('scrGame'); refreshAllTabs(); setActiveTab('story');}else showToast("无存档","err"); }); });
        document.getElementById('simEditorBtn')?.addEventListener('click',()=>{ loadAllConfigs(); showScreen('scrSimEditor'); });
        document.getElementById('apiConfigBtn')?.addEventListener('click',()=>{ loadAllConfigs(); renderPresetList(); showScreen('scrApi'); });
        document.getElementById('saveSimulatorConfig')?.addEventListener('click',saveSimulatorConfig);
        document.getElementById('saveApiPresetBtn')?.addEventListener('click',saveApiPreset);
        document.getElementById('resetDefaultConfig')?.addEventListener('click',()=>{ localStorage.removeItem("kilidia_simulator_config"); location.reload(); });
        document.getElementById('tempSlider')?.addEventListener('input',updateSliderDisplay);
        document.getElementById('topPSlider')?.addEventListener('input',updateSliderDisplay);
        document.getElementById('topKSlider')?.addEventListener('input',updateSliderDisplay);
        document.getElementById('exportSaveBtn')?.addEventListener('click',()=>{ if(game){ let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(game)],{type:"application/json"})); a.download="kilidia_save.json"; a.click(); showToast("导出成功","ok");} });
        document.getElementById('importSaveBtn')?.addEventListener('click',()=>document.getElementById('importFile').click());
        document.getElementById('importFile')?.addEventListener('change',e=>{ let f=e.target.files[0]; if(f){ let r=new FileReader(); r.onload=ev=>{ try{ game=JSON.parse(ev.target.result); saveGameToLocal(); showToast("导入成功","ok"); showScreen('scrGame'); refreshAllTabs(); setActiveTab('story'); }catch(ex){ showToast("文件无效","err"); } }; r.readAsText(f); } });
        document.getElementById('gameMenuBtn')?.addEventListener('click',()=>{ let m=document.getElementById('menuOv'); document.getElementById('menuBox').innerHTML=`<div class="menu-item" id="menuSave">💾 保存</div><div class="menu-item" id="menuExit">🏠 主菜单</div>`; m.style.display='flex'; document.getElementById('menuSave')?.addEventListener('click',()=>{ if(game) saveGameToLocal(); showToast("已保存","ok"); m.style.display='none'; }); document.getElementById('menuExit')?.addEventListener('click',()=>{ if(game) saveGameToLocal(); m.style.display='none'; showScreen('scrHome'); }); m.addEventListener('click',e=>{ if(e.target===m) m.style.display='none'; }); });
        document.querySelectorAll('.nav-i').forEach(btn=>btn.addEventListener('click',()=>{ let tab=btn.getAttribute('data-tab'); if(tab) setActiveTab(tab); }));
        loadAllConfigs();
        if(loadGameFromLocal()) console.log("已有存档可读取");
    })();
</script>
</body>
</html>
